# ~/.tmux.conf — tuned for running several coding agents in parallel on macOS
# Reload after editing:  tmux source-file ~/.tmux.conf

# ---------- core ----------
set -g prefix C-a                  # Ctrl-a is easier than Ctrl-b; Ctrl-b is nvim page-up
unbind C-b
bind C-a send-prefix               # Ctrl-a Ctrl-a sends a literal Ctrl-a

set -g mouse on
set -g history-limit 100000
set -sg escape-time 0              # critical: 500ms default makes vim/nvim ESC feel broken
set -g focus-events on
set -g base-index 1                # windows start at 1, matches keyboard layout
setw -g pane-base-index 1
set -g renumber-windows on

# truecolor
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,xterm-ghostty:Tc,xterm-kitty:Tc"

# ---------- THE IMPORTANT BIT: agent status in the tab title ----------
# Claude Code and Codex emit their status as a terminal title escape sequence.
# allow-rename lets them write it into the tmux window name.
# automatic-rename must be OFF or tmux overwrites it with the process name.
set -g allow-rename on
setw -g automatic-rename off
set -g set-titles on
set -g set-titles-string "#S:#I #W"

# highlight windows with new output — this is how you spot an agent that just
# finished or is waiting on you, without switching to it
setw -g monitor-activity on
set -g visual-activity off

# ---------- status bar ----------
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=default,fg=colour245"
set -g status-left "#[fg=colour39,bold] #S #[default]"
set -g status-left-length 30
set -g status-right "#[fg=colour245]%H:%M "
# current window = bright, activity (agent did something) = yellow dot
setw -g window-status-format         " #I:#W "
setw -g window-status-current-format "#[fg=colour39,bold] #I:#W #[default]"
setw -g window-status-activity-style "fg=colour214"

# ---------- splits & panes ----------
bind | split-window -h -c "#{pane_current_path}"   # agent left, editor/diff right
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
bind c new-window -c "#{pane_current_path}"

# vim-style pane movement
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# resize (repeatable — hold the key)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# jump to last window — the main "check on the other agent" motion
bind Space last-window

# ---------- copy mode ----------
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# ---------- quality of life ----------
bind r source-file ~/.tmux.conf \; display "reloaded"
bind S command-prompt -p "new session:" "new-session -A -s '%%'"
set -g detach-on-destroy off       # dropping a session lands you in another, not the shell
